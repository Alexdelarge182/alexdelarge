<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotografía | Alex Delarge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
nav{position:fixed;top:0;left:0;width:100%;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.25);backdrop-filter:blur(12px);z-index:999}
.nav-logo img{height:42px}
.menu a{color:#fff;text-decoration:none;letter-spacing:3px;text-transform:uppercase;font-size:.75rem}
.hero{height:70vh;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.8)),url("assets/photos/portadafoto.jpg");background-size:cover;background-position:center;display:flex;justify-content:center;align-items:center}
.hero h1{font-size:4rem;font-weight:300;letter-spacing:8px}
.filters{padding:60px 20px;display:flex;justify-content:center;gap:15px;flex-wrap:wrap}
.filter-btn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;padding:12px 20px;cursor:pointer;letter-spacing:2px;text-transform:uppercase}
.filter-btn.active,.filter-btn:hover{background:#fff;color:#000}
.photo-count{text-align:center;margin-bottom:40px;letter-spacing:4px;font-size:.8rem;color:#999;text-transform:uppercase}
.gallery{padding:0 8% 100px;column-count:3;column-gap:20px}
.gallery img{width:100%;margin-bottom:20px;cursor:pointer;break-inside:avoid}
.hidden{display:none}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);justify-content:center;align-items:center;z-index:9999}
.lightbox.active{display:flex}
.lightbox img{max-width:92%;max-height:92%;box-shadow:0 0 40px rgba(0,0,0,.8)}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);font-size:3rem;color:white;cursor:pointer;padding:20px;user-select:none}
.prev{left:20px}.next{right:20px}
footer{padding:80px 20px;text-align:center;border-top:1px solid #1a1a1a}
footer p{margin-bottom:12px}
@media(max-width:900px){.gallery{column-count:2}}
@media(max-width:600px){.gallery{column-count:1}.hero h1{font-size:2.2rem}}
</style>
</head>
<body>
<nav>
<a href="index.html" class="nav-logo"><img src="assets/logo/logob.png"></a>
<div class="menu"><a href="index.html">Inicio</a></div>

<script>
function filterSelection(category,btn){
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
document.querySelectorAll('.gallery img').forEach(img=>{
if(category==='all'){img.classList.remove('hidden');}
else{img.classList.toggle('hidden',!img.classList.contains(category));}
});
}

const images=[...document.querySelectorAll('.gallery img')];
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightbox-img');
let current=0;

function showImage(i){
current=i;
lightboxImg.src=images[current].src;
}

images.forEach((img,i)=>img.addEventListener('click',()=>{
lightbox.classList.add('active');
showImage(i);
}));

document.getElementById('prev').onclick=(e)=>{
e.stopPropagation();
showImage((current-1+images.length)%images.length);
};

document.getElementById('next').onclick=(e)=>{
e.stopPropagation();
showImage((current+1)%images.length);
};

document.addEventListener('keydown',(e)=>{
if(!lightbox.classList.contains('active')) return;
if(e.key==='Escape') lightbox.classList.remove('active');
if(e.key==='ArrowLeft') showImage((current-1+images.length)%images.length);
if(e.key==='ArrowRight') showImage((current+1)%images.length);
});

lightbox.addEventListener('click',()=>lightbox.classList.remove('active'));
</script>
