<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fotografía | Alex Delarge</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#050505;
color:white;
font-family:Arial, Helvetica, sans-serif;
overflow-x:hidden;
}

/* NAV */

nav{

position:fixed;
top:0;
left:0;

width:100%;

padding:18px 40px;

display:flex;
justify-content:space-between;
align-items:center;

background:rgba(0,0,0,.25);
backdrop-filter:blur(12px);

z-index:999;

}

.nav-logo img{

height:42px;
width:auto;

}

.menu{

display:flex;
gap:35px;

}

.menu a{

color:white;
text-decoration:none;

font-size:.75rem;
letter-spacing:3px;
text-transform:uppercase;

}

/* HERO */

.hero{

height:70vh;

background:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.80)
),
url("assets/photos/r8.jpg");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

text-align:center;

}

.hero h1{

font-size:4rem;
font-weight:300;
letter-spacing:8px;

}

/* FILTROS */

.filters{

padding:60px 20px;

display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;

}

.filter-btn{

background:none;
border:1px solid rgba(255,255,255,.25);

color:white;

padding:12px 20px;

cursor:pointer;

letter-spacing:2px;
text-transform:uppercase;

transition:.3s;

}

.filter-btn:hover{

background:white;
color:black;
.filter-btn.active{

background:white;
color:black;


}

/* GALERIA */

.gallery{

padding:0 8% 100px;

column-count:3;
column-gap:20px;

}

.gallery img{

width:100%;
margin-bottom:20px;

cursor:pointer;

transition:.3s;

break-inside:avoid;

}

.gallery img:hover{

opacity:.85;

transform:scale(1.01);

}

.hidden{

display:none;

}

/* LIGHTBOX */

.lightbox{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.95);

justify-content:center;
align-items:center;

z-index:9999;

}

.lightbox.active{

display:flex;

}

.lightbox img{

max-width:92%;
max-height:92%;

box-shadow:
0 0 40px rgba(0,0,0,.8);

border-radius:4px;

}

/* FOOTER */

footer{

padding:80px 20px;

text-align:center;

border-top:1px solid #1a1a1a;

}

footer p{

margin-bottom:12px;

}

footer a{

color:white;
text-decoration:none;

}

/* MOBILE */

@media(max-width:900px){

.gallery{

column-count:2;

}

}

@media(max-width:600px){

.gallery{

column-count:1;

}

.hero h1{

font-size:2.2rem;

}

.menu{

gap:15px;
flex-wrap:wrap;

}

}

</style>

</head>

<body>

<script>

function filterSelection(category){

const images =
document.querySelectorAll('.gallery img');

const buttons =
document.querySelectorAll('.filter-btn');

buttons.forEach(btn=>{
btn.classList.remove('active');
});

event.target.classList.add('active');

images.forEach(img=>{

if(category==="all"){

img.classList.remove('hidden');

}else{

img.classList.toggle(
'hidden',
!img.classList.contains(category)
);

}

});

}

const lightbox =
document.getElementById('lightbox');

const lightboxImg =
document.getElementById('lightbox-img');

document.querySelectorAll('.gallery img').forEach(img=>{

img.addEventListener('click',()=>{

lightbox.classList.add('active');

lightboxImg.src = img.src;

});

});

lightbox.addEventListener('click',()=>{

lightbox.classList.remove('active');

});

</script>
